<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Savaya — Child of Light</title>
  <meta name="description" content="+OTPE Kids — A place of light, fun, and hope. Savaya shines with positivity, showing that kindness, balance, and energy make us stronger together.">
  <link rel="stylesheet" href="site.css">
  <style>
    .spark{height:6px;width:6px;border-radius:50%;background:#f39c12;position:absolute;opacity:.8;animation:floatUp 9s linear infinite}
    @keyframes floatUp{from{transform:translateY(100vh) scale(.6);opacity:.9}to{transform:translateY(-10vh) scale(1.4);opacity:0}}
  </style>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <h1>Savaya — Child of Light</h1>
      <p class="tag">A playful spark in the +OTPE flow.</p>
      <nav class="nav"><a class="btn" href="index.html">⬅ Home</a></nav>
    </div>
  </header>

  <main class="wrap">
    <section class="card center">
      <p>Savaya is one of the radiant lights of +OTPE. Her energy brings kindness, creativity, and hope. She reminds us that the future is bright.</p>
    </section>
  </main>

  <footer class="foot">+OTPE+ — The next generation shines.</footer>

  <script>
    // gentle sparkles
    for(let i=0;i<40;i++){
      const s=document.createElement('div');
      s.className='spark';
      s.style.left=(Math.random()*100)+'vw';
      s.style.animationDuration=(6+Math.random()*8)+'s';
      s.style.background=(Math.random()>0.5)?'#f39c12':'#ffd54f';
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
